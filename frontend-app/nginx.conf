# File config Nginx để chạy trong container
server {
    # Nginx sẽ lắng nghe ở cổng 80 (bên trong container)
    listen 80;

    # Phục vụ file tĩnh (React app)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Dành cho React Router: nếu không tìm thấy file, trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy (Chuyển tiếp) các API ---

    # 1. Chuyển request /api/users/* đến user-service
    location /api/users {
        # Tên "user-service" là tên service trong Docker Compose
        proxy_pass http://user-service:8080; 
        
        # Cấu hình header để Spring Boot biết request đến từ đâu
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Chuyển request /api/stations/* đến vehicle-service
    location /api/stations {
        # Tên "vehicle-service" là tên service trong Docker Compose
        proxy_pass http://vehicle-service:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Chuyển request /api/vehicles/* đến vehicle-service
    location /api/vehicles {
        # Tên "vehicle-service" là tên service trong Docker Compose
        proxy_pass http://vehicle-service:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Chuyển request /api/bookings/* đến booking-service
    location /api/bookings {
        # Tên "booking-service" là tên service trong Docker Compose
        proxy_pass http://booking-service:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 5. Chuyển request /api/payments/* đến payment-service
    location /api/payments {
        # Tên "payment-service" là tên service trong Docker Compose
        proxy_pass http://payment-service:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. KHỐI MỚI: Chuyển request /api/reports/* đến reporting-service
    location /api/reports {
        # Tên "reporting-service" là tên service trong Docker Compose
        proxy_pass http://reporting-service:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

