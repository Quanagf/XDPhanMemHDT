# File config Nginx để chạy trong container
server {
    # Nginx sẽ lắng nghe ở cổng 80 (bên trong container)
    listen 80;

    # Cấu hình upload file
    client_max_body_size 10M;        # Cho phép upload file tối đa 10MB
    client_body_buffer_size 128k;    # Buffer cho request body
    client_body_timeout 120s;       # Timeout cho upload
    proxy_read_timeout 300s;        # Timeout cho proxy
    proxy_connect_timeout 300s;     # Timeout kết nối proxy

    # Phục vụ file tĩnh (React app)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Dành cho React Router: nếu không tìm thấy file, trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy (Chuyển tiếp) các API ---

    # 1. Chuyển request /api/users/* đến user-service
    location /api/users {
        # Tên "user-service" là tên service trong Docker Compose
        # Trong docker network, service luôn dùng internal port (8080)
        proxy_pass http://user-service:8080; 
        
        # Cấu hình header để Spring Boot biết request đến từ đâu
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cấu hình đặc biệt cho upload file
        proxy_request_buffering off;     # Không buffer request để upload nhanh hơn
        proxy_buffering off;             # Không buffer response
        proxy_set_header Connection "";  # Giữ connection
    }

    # 1a. Chuyển request /api/complaints/* đến user-service
    location /api/complaints {
        proxy_pass http://user-service:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
