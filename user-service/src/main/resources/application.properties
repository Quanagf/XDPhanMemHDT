# Service sẽ chạy trên cổng 8080 (bên trong Docker)
server.port=8080

# --- Cấu hình MySQL ---
spring.datasource.url=jdbc:mysql://mysql-db:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# --- Cấu hình JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Cấu hình Minio ---
# "minio" là tên service trong docker-compose.yml
minio.endpoint=http://minio:9000
minio.access-key=minioadmin
minio.secret-key=minioadminpassword
minio.bucket-name=ev-rental

# --- Cấu hình RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

logging.level.org.springframework.security=TRACE