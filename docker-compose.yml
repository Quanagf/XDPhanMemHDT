services:
  # 1. Database
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: 2005
    volumes: 
      - mysql-data:/var/lib/mysql

  # 2. Redis
  redis:
    image: redis:alpine
    container_name: redis
    ports: ["6379:6379"]

  # 3. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports: ["5672:5672", "15672:15672"]

  # 4. Eureka Server
  eureka-server:
    build: ./eureka-server 
    container_name: eureka-server
    ports: ["8761:8761"] 

  # 5. API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports: ["8080:8080"] 
    depends_on: 
      - eureka-server 
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # 6. User Service
  user-service:
    build: ./user-service
    container_name: user-service
    depends_on: 
      - mysql-db
      - eureka-server
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/userdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2005
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq

  # 7. Booking Service
  booking-service:
    build: ./booking-service
    container_name: booking-service
    depends_on: 
      - mysql-db
      - eureka-server
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookingdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2005
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis 
      SPRING_RABBITMQ_HOST: rabbitmq

  # 8. Fleet Service
  fleet-service:
    build: ./fleet-service
    container_name: fleet-service
    depends_on: 
      - mysql-db
      - eureka-server
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/fleetdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2005
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis 
      SPRING_RABBITMQ_HOST: rabbitmq

  # 9. Payment Service
  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on: 
      - mysql-db
      - eureka-server
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/paymentdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2005
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis 
      SPRING_RABBITMQ_HOST: rabbitmq

  # 10. Notification Service
  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on: 
      - mysql-db
      - eureka-server
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/notificationdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2005
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis 
      SPRING_RABBITMQ_HOST: rabbitmq
      
  # 11. Analytics Service
  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    depends_on: 
      - mysql-db
      - eureka-server
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/analyticsdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2005
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis 
      SPRING_RABBITMQ_HOST: rabbitmq
      
  # 12. Validation Service
  validation-service:
    build: ./validation-service
    container_name: validation-service
    depends_on: 
      - mysql-db
      - eureka-server
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/validationdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2005
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis 
      SPRING_RABBITMQ_HOST: rabbitmq

  # 13. Apache NiFi (ĐÃ SỬA THỤT LỀ)
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    ports:
      - "8443:8443" 
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_SENSITIVE_PROPS_KEY=averysecretkey1234567 
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - ./uploads:/opt/nifi/uploads 
    depends_on:
      - validation-service 

  # 14. Frontend (ĐÃ SỬA THỤT LỀ)
  client:
    build: ./client 
    container_name: client
    ports: ["3000:80"] 
    depends_on: 
      - api-gateway 

# --- KHỐI VOLUMES ĐÃ SỬA THỤT LỀ ---
volumes:
  mysql-data:
  nifi_conf:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository: