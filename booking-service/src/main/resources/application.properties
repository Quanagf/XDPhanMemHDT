# Service này sẽ chạy trên cổng 8080 (bên trong Docker)
server.port=8080

# --- Cấu hình MySQL ---
spring.datasource.url=jdbc:mysql://mysql-db:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# --- Cấu hình JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Cấu hình (MỚI) ---
# Tên service của các dịch vụ khác (dùng để gọi API nội bộ)
service.url.users=http://user-service:8080
service.url.vehicles=http://vehicle-service:8080
service.url.payment=http://payment-service:8080