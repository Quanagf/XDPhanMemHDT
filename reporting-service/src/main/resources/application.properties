# Service này sẽ chạy trên cổng 8080 (bên trong Docker)
server.port=8080

# --- Cấu hình MySQL ---
spring.datasource.url=jdbc:mysql://mysql-db:3306/reporting_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# --- Cấu hình JPA ---
# RẤT QUAN TRỌNG: Đặt là "none" hoặc "validate"
# Service này KHÔNG BAO GIỜ được phép thay đổi CSDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true