# Service này sẽ chạy trên cổng 8080 (bên trong Docker)
server.port=8080

# --- Cấu hình MySQL ---
spring.datasource.url=jdbc:mysql://mysql-db:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# --- Cấu hình JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true