server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # --- 1. CẤU HÌNH SỬA LỖI CORS ---
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000" # Cho phép React (cổng 3000)
            allowed-methods: "*"
            allowed-headers: "*"
      
      # --- 2. CẤU HÌNH ROUTES (ĐẦY ĐỦ) ---
      routes:
        # --- User Service Routes (Đã tách biệt) ---
        - id: user-service-renter-auth
          uri: lb://user-service 
          predicates:
            - Path=/api/auth/renter/** # Cổng cho Renter

        - id: user-service-internal-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/internal/** # Cổng cho Admin/Staff
        
        - id: user-service-management
          uri: lb://user-service
          predicates:
            - Path=/api/users/** # Cổng cho Admin tạo Staff

        # --- Các Service Khác ---
        - id: booking-service-route
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
            
        - id: fleet-service-route
          uri: lb://fleet-service
          predicates:
            - Path=/api/fleet/**
            
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        
        - id: notification-service-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
            
        - id: analytics-service-route
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
            
        - id: validation-service-route
          uri: lb://validation-service
          predicates:
            - Path=/api/validation/**

# --- 3. CẤU HÌNH EUREKA ---
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/